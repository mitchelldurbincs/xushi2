phase: 4
env:
  # v6.5 — v6 plus time_penalty_per_second: 0.05 to break the deny-stalemate
  # equilibrium. v6 plateaued at update 150 with onpt~0.025 / score 0/7 /
  # 0/50 wins because both teams' walk_to_objective behavior arrives at the
  # cap and contests it 3v3, which means nobody scores and PPO sees ~0
  # reward for "stay near cap" vs "stay away from cap" — entropy then
  # pushes toward whichever. tps=0.05 makes a 30s 0/0 draw net ~-1.5 to
  # both teams, breaking the equilibrium. Same recipe Phase 3 needed in
  # phase3_ranger_objective_curriculum_warmstart_v3.yaml (notes there
  # describe the exact same failure mode in 1v1).
  seed_base: 0xD1CEDA7A
  opponent_bot: walk_to_objective
  learner_team: A
  reward:
    score_per_second: 0.05
    kill_bonus: 0.0
    distance_shaping_coef: 0.01
    on_point_shaping_coef: 0.0
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 7500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 16
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 3.0e-4
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
run:
  total_updates: 1500
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v6_5
