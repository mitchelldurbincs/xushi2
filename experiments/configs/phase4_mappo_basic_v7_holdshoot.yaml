phase: 4
env:
  # v7-holdshoot — INTERMEDIATE rung between v6.5 (walk_to_objective, no fire)
  # and the original v7 (basic, full adversarial). Our v6.5 cap-holding
  # policy got demolished against `basic` at update 50: 0/50 wins, 0/30 kills,
  # full 0/7 score loss. The jump from "no-fire opponent" to "walks to cap
  # AND shoots" was too big.
  #
  # hold_and_shoot stays at spawn and fires at the nearest enemy — it does
  # NOT contest the cap. So:
  #   - Our agents can reach the cap unopposed (cap-holding behavior preserved)
  #   - Score comes immediately (uncontested cap → fast points)
  #   - But agents take fire while traversing/holding the cap, so combat
  #     skill (dodge / return fire) gets a survival-pressure signal
  #
  # Once this trains a stable scorer-under-fire, warm-start from it into
  # phase4_mappo_basic_v8.yaml (basic opponent — was originally v7).
  seed_base: 0xD1CEDA7A
  opponent_bot: hold_and_shoot
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.01
    on_point_shaping_coef: 0.0
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 7500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 16
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_holdshoot
