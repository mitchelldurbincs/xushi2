phase: 4
env:
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    distance_shaping_coef: 0.005
    # 3x the implicit defaults from reward.py to compensate for the per-agent
    # decomposition: the old broadcast path had each kill credit each agent
    # +kill_bonus, so cumulative team gradient signal was 3 * kill_bonus per
    # event. The new per-agent path credits the killer's slot only, so the
    # cumulative team gradient signal is 1 * kill_bonus per event. Scale
    # kill_bonus / death_penalty / score_per_second by 3x to match the
    # gradient magnitude phase4_mappo_basic.yaml was implicitly tuned for.
    kill_bonus: 0.75
    death_penalty: 0.75
    score_per_second: 0.03
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 7500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 8
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 4
  learning_rate: 3.0e-4
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
run:
  total_updates: 250
  eval_every: 25
  eval_episodes: 10
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_basic_3x_shaping
