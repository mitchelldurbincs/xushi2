phase: 4
env:
  # v7-basic-reduced-bc-v3 — BC pretrain WITH FIRING variant.
  #
  # v7_basic_reduced_bc_v2 (500 damage + walk-only BC) failed: agents held
  # cap beautifully (onpt ~0.62) but NEVER fired (bin=0.000). With 500 damage,
  # neither team could kill the other — stalemate 50/50 draws, score 0/0.
  #
  # Fix: BC pretrain now explicitly teaches WALK + AIM + FIRE. The new
  # `bc_pretrain_walk_and_shoot_to_objective` function:
  #   - walks toward cap (same as before)
  #   - aims toward nearest visible enemy (compute angle from enemy_relative_position)
  #   - sets primary_fire=1 when enemy is alive and visible
  #
  # This should initialize the binary action head away from zero BEFORE PPO
  # starts, giving PPO a nonzero fire baseline to reinforce when kills happen.
  #
  # Damage kept at 500 centi-HP (5 HP per shot, ~20 hits to die) so agents
  # have time to survive while learning to aim better through PPO.
  #
  # If BC eval shows nonzero kills but PPO still flatlines, the issue is
  # PPO unlearning the fire behavior — need higher entropy or lower damage.
  #
  # Success: nonzero wins or score within first 200 updates. Stop if still
  # 0/50 losses/draws at update 200 with bin still near zero.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_pretrain_variant: walk_and_shoot
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v3
