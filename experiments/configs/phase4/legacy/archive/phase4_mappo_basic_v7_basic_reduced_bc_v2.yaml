phase: 4
env:
  # v7-basic-reduced-bc-v2 — MUCH LOWER DAMAGE variant.
  #
  # v7_basic_reduced_bc failed: BC pretrain converged (loss 0.23->0.0004),
  # re-anchored cap-walking, but basic bot still slaughtered agents 50/50
  # at 2500 damage. Agents reached cap (onpt ~0.10, dist ~0.38) but never
  # fired (bin=0.000) and died in ~4 hits. PPO saw "cap = death" and
  # could not discover firing fast enough to survive.
  #
  # Fix: drop revolver damage to 500 centi-HP (5 HP per shot, ~20 hits
  # to die). Agents can tank cap position long enough to:
  #   - survive while holding cap
  #   - discover the fire action exists (binary action, currently unused)
  #   - learn that firing back reduces incoming damage
  #   - eventually hold cap + shoot = score
  #
  # The basic opponent still contests the cap (walks to it + fires),
  # so retreat = enemy scores = lose. No safe timeout basin.
  #
  # Same BC pretrain + warm-start as v7_basic_reduced_bc:
  #   - warm-start from v6_5 ckpt_final.pt
  #   - bc_pretrain_steps: 500 (re-anchor cap-walking)
  #   - entropy_coef: 0.005 (preserve BC structure)
  #
  # Success: nonzero wins or score within first 200 updates. Stop if
  # still 0/50 losses at update 200 — then damage is not the issue.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  # Matched to physical CPU cores (4) to reduce contention and context switching.
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v2