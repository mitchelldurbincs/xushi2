phase: 4
env:
  # v7-holdshoot-v3 — REDUCED DAMAGE variant of v2.
  #
  # v7_holdshoot_v2 failed identically to v7_holdshoot: agents retreated
  # from cap and learned to survive by never fighting or scoring.
  #
  # Root cause discovered by Codex deep audit: the reward clipper (shaping_clip=3.0)
  # saturates at +3.0 for ALL strategies — retreat, hover, or cap. Against
  # hold_and_shoot with full damage (7500 centi-HP = 75 HP per shot), capping
  # means instant death. Death penalty is absorbed by the saturated clipper,
  # so there is ZERO reward gradient pushing agents toward the cap.
  #
  # Fix: reduce revolver damage so agents can survive on cap long enough to
  # score. With 2500 centi-HP (25 HP per shot), agents take ~4 hits to die
  # instead of ~1.3. This gives them time to learn that capping is viable,
  # and the score reward (+0.10/sec) can actually register before death.
  #
  # All other settings identical to v2:
  #   - distance_shaping_coef: 0.05 (stronger cap proximity pressure)
  #   - on_point_shaping_coef: 0.02 (direct reward for cap contact)
  #   - Warm-start from v6_5 ckpt_final.pt (cap-reaching behavior)
  #
  # Success criterion: onpt > 0.1 and score > 0 within first 100 updates.
  # If this also fails, the problem is fundamental to the hold_and_shoot
  # opponent design — need a different curriculum stage (e.g. basic with
  # reduced damage, or walk_and_shoot).
  seed_base: 0xD1CEDA7A
  opponent_bot: hold_and_shoot
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 2500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  # Matched to physical CPU cores (4) to reduce contention and context switching.
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_holdshoot_v3