phase: 4
metadata:
  phase: phase4
  purpose: combat_improvement
  status: experimental
  expected_runtime: very_long
  gate_relevance:
  - phase4_combat_curriculum
  lineage: v5 config with 4x entropy. Frozen draw equilibrium at LR 1e-6 proved stable for 450+ updates with zero improvement. High entropy adds aim-angle exploration without breaking cap-holding at tiny LR steps.

# v7-basic-reduced-bc-v5-high-entropy -- EXPLORE AIM ANGLES via entropy.
#
# v5 (LR 1e-6, entropy 0.02, 30s, 1000 damage, basic) proved the draw
# equilibrium is STABLE for 450+ updates. BC walk_and_shoot warm-start
# preserves cap-holding + firing. But zero wins, zero kills, zero
# score improvement across all evals. The policy deterministically repeats
# the same crude aim angles.
#
# v8v2 (LR 5e-5, basic at cap) collapsed into fleeing within 50 updates.
# The cap = getting shot by perfect-aim bot = run away.
#
# This config keeps the STABLE v5 parameters but raises entropy to 0.08
# (4x higher). At LR 1e-6 the policy steps are tiny, so high entropy
# won't break cap-holding. But the action distribution becomes noisier,
# especially around aim angles. This creates natural exploration of
# lead/tracking without explicitly engineering a curriculum opponent.
#
# Hypothesis: the draw equilibrium exists because both teams aim at
# each other's CURRENT position with equal inaccuracy (neural noise vs
# perfect aim at moving target). Higher entropy increases aim variance,
# potentially stumbling on better predictive aim (lead shots) that
# produces hits. Even tiny hit-rate improvements at 1000 damage can
# shift the equilibrium toward wins over hundreds of updates.
#
# If this also produces only draws at update 1000, the draw basin is
# deeper than entropy can escape, and we need architecture changes
# (separate combat head, auxiliary aim prediction) or a genuinely
# weaker opponent.

env:
  seed_base: 3519994490
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  # 4x higher than v5. Encourages aim-angle exploration while
  # preserving cap-holding at tiny LR steps.
  entropy_coef: 0.08
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 1000
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v5_high_entropy
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
