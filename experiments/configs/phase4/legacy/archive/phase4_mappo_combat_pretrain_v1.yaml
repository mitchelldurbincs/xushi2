phase: 4
env:
  # v8-combat-pretrain-v1 — PURE COMBAT STAGE.
  #
  # v7 (bot fire cooldown 30 + 30s rounds + LR 2e-6) proved the draw equilibrium
  # is ROBUST against fire-rate changes. Even with 10:1 theoretical DPS
  # advantage (bot fires every 30 ticks, we fire at bin=0.33), the bot
  # consistently gets 7-12 kills per 50 episodes while we get 0-2.
  #
  # The bottleneck is AIM QUALITY, not fire rate or damage. Our BC heuristic
  # aim (point at nearest visible enemy's current position) is too crude
  # to hit moving targets. The bot's scripted aim is significantly better.
  #
  # This stage ISOLATES COMBAT LEARNING from 3v3 objective complexity.
  # We use a stationary shooter opponent (hold_and_shoot) with extremely
  # low damage and very slow fire rate, so agents survive long enough to
  # learn aim refinement through PPO. Strong kill and damage rewards
  # (with no death penalty) create pure combat incentive.
  #
  # No cap scoring, no timeout pressure, no death penalty.
  # The ONLY rewards are combat: kill_bonus + damage_dealt.
  # This lets PPO refine aim quality without the 3v3 objective noise.
  #
  # Once eval shows Team A kills > bot kills consistently, we warm-start
  # this combat-capable checkpoint into the full 3v3 objective stage.
  #
  # Key insight from v7: bot aim > our aim. Nerfing bot fire rate
  # cannot overcome aim quality gap. We must explicitly train aim.
  opponent_bot: hold_and_shoot
  score_per_second: 0.0
  time_penalty_per_second: 0.0
  death_penalty: 0.0
  kill_bonus: 1.0
  damage_dealt_per_second: 0.2
  distance_shaping_coef: 0.0
  on_point_shaping_coef: 0.0
  revolver_damage_centi_hp: 250
  revolver_fire_cooldown_ticks: 60
  round_length_seconds: 60

mappo:
  num_updates: 1500
  # More aggressive LR than conservative v5 — we're not preserving a delicate
  # cap-holding equilibrium. We're actively trying to improve combat skill.
  learning_rate: 5.0e-5
  # Keep entropy high to encourage exploration of aim angles.
  entropy_coef: 0.02
  team_spirit: 0.3
  team_spirit_end: 1.0
  team_spirit_ramp_updates: 1000
  use_wandb: true
  action_repeat: 3
  # Warm-start from the proven cap-holder — gives initial movement behavior.
  # The walk_and_shoot BC re-anchors cap-walking + firing + aiming.
  warmup_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
  num_envs: 64
  batch_size: 256
  total_timesteps: 115200000

# Evaluate using the same reduced bot (hold_and_shoot), since this is a
# combat-only stage. Success = Team A kills > bot kills with upward trend.
eval:
  num_eval_episodes: 50
  eval_interval_updates: 50
  opponent_bot: hold_and_shoot

seed: 0xD1CEDA7A
