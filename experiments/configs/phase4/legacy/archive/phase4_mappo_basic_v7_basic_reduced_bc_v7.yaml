phase: 4
env:
  # v7-basic-reduced-bc-v7 — SLOWER OPPONENT FIRE variant.
  #
  # v7_basic_reduced_bc_v6 (60s rounds + LR 2e-6 + 1000 damage) was catastrophic:
  # BC policy ALONE lost at 60s rounds (score 0/7.53). At 30s it produced draws.
  # Longer rounds favor the stronger combatant (basic bot), not the learner.
  # PPO made it worse: bot score climbed 7.50 → 25.33, our kills 4.0 → 0.0.
  #
  # Root cause: 60s gives the bot's superior aim/fire too much time to dominate.
  # The correct lever is NOT round length — it's making the bot WORSE at combat
  # to create an exploitable asymmetry for our BC-firing policy.
  #
  # Fix: double opponent fire cooldown from 15 → 30 ticks. Bot fires half as often.
  # Our BC policy fires at bin=0.33 (every ~3rd tick on average). With bot at
  # 30-tick cooldown, we have a 2:1 fire-rate advantage. This creates a natural
  # asymmetry: if both teams trade shots on cap, we should win the DPS race.
  #
  # Combine with 30s rounds (back to the draw-producing BC sweet spot) and
  # LR 2e-6 + entropy 0.02 (conservative but 2× faster than v5's 1e-6).
  #
  # Theory: the draw equilibrium at 30s/1000dmg/15cooldown existed because both
  # teams traded shots ineffectually with equal fire rate. Halving the bot's
  # fire rate breaks the symmetry — our higher DPS should produce more kills,
  # which with on_point_shaping + score_per_second creates positive gradient.
  #
  # If this also fails (still all draws or losses at update 300), the problem
  # is either (a) BC aim quality is too poor to hit anything reliably even with
  # 2:1 DPS advantage, or (b) 30s is still too short for any kill advantage to
  # translate to score regardless of DPS ratio.
  #
  # Success: any wins or score > 0 within first 300 updates. At minimum,
  # upward-trending kills (ours > bot's) by update 200.
  # Stop if losses at update 200 or still all draws at update 500.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 30
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 2.0e-6
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_pretrain_variant: walk_and_shoot
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v7
