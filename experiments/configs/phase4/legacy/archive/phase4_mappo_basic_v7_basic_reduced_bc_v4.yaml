phase: 4
env:
  # v7-basic-reduced-bc-v4 — GOLDILOCKS DAMAGE variant.
  #
  # v7_basic_reduced_bc_v3 (BC with firing + 500 damage) got BC firing to work
  # (bin=0.330 throughout), but 500 damage created a pillow-fight stalemate:
  # both teams fired, neither could kill anyone consistently in 30s rounds.
  # Result: 50/50 draws, score 0/0, 0-3 kills per 50 episodes, flat mean_reward.
  #
  # v7_basic_reduced_bc (2500 damage) was the opposite extreme: instant slaughter.
  # Agents died in ~4 hits, zero survival window to learn.
  #
  # This v4 tries the middle ground: 1000 centi-HP = 10 HP per shot, ~10 hits to die.
  # Theory: survivable enough for the BC-initialized firing behavior to matter,
  # but lethal enough that sustained cap-hold + fireback produces actual kills
  # and score within 30-second rounds. Should create a gradient where "fire better
  # and survive" = win, rather than "everyone fires ineffectually" = draw.
  #
  # If this also fails (still all draws at update 200), the issue is either:
  #   - Aim quality from BC heuristic is too poor to score hits reliably
  #   - 30s rounds are too short for 10-hit kills at the bot's fire rate
  #   - Need to also tune bot fire cooldown or hitbox radius
  #
  # Success: any wins or score > 0 within first 200 updates. At minimum,
  # eval should show upward-trending kills (not flat 0-3 per 50 eps).
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_pretrain_variant: walk_and_shoot
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v4
