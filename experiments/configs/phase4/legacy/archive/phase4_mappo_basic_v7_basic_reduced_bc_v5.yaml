phase: 4
env:
  # v7-basic-reduced-bc-v5 — CONSERVATIVE PPO variant.
  #
  # v7_basic_reduced_bc_v4 (1000 damage + BC firing) revealed the critical
  # finding: the BC policy ALONE produces draws at 1000 damage (mean_reward
  # -0.686, score 0/0, 50/50 draws). But after just 50 PPO updates, it
  # collapses to 50/50 LOSSES (score 0/6, kills 0/15). PPO is actively
  # unlearning a working draw-producing policy into a losing one.
  #
  # Root cause: PPO learning rate (5e-5) is too aggressive for this
  # adversarial jump. It takes large policy steps in a high-variance
  # environment where the BC policy is already near a local optimum
  # (draws). Large steps break the delicate aim+fire balance and fall
  # into a losing basin. Low entropy (0.005) also prevents recovery
  # once the policy starts losing.
  #
  # Fix: dramatically lower LR (1e-6) + higher entropy (0.02) to make
  # PPO extremely conservative. It should barely move the BC policy,
  # preserving the draw-producing behavior while allowing tiny
  # refinements. If even a single win appears in 50 evals, the
  # minuscule positive gradient at LR 1e-6 will slowly amplify it.
  #
  # Entropy 0.02 maintains enough exploration that the policy doesn't
  # collapse into a single deterministic losing strategy.
  #
  # If this still fails (losses at update 200), the problem is either:
  #   - The BC aim heuristic is too inaccurate to ever score hits
  #   - PPO simply cannot improve from a draw basin against this opponent
  #   - Need a completely different approach (e.g., curriculum via walk_to_objective first)
  #
  # Success: any wins or score > 0 within first 300 updates. At minimum,
  # preserve the BC draw behavior (not collapse to losses).
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_pretrain_variant: walk_and_shoot
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v5
