phase: 4
env:
  # v7-basic-reduced-bc-v6 — 60-SECOND ROUNDS + SLIGHTLY HIGHER LR variant.
  #
  # v7_basic_reduced_bc_v5 (conservative PPO: LR 1e-6 + entropy 0.02 + 1000 damage)
  # proved the draw equilibrium is REAL. BC policy produced draws at 1000 damage.
  # Conservative PPO preserved draws for 450 updates — ZERO losses, ZERO wins.
  # Kills traded at 2-8 per 50 episodes, but nobody scored. Score 0/0 across all evals.
  #
  # Two changes together:
  #   1. Double round length to 60 seconds — more time for sustained combat
  #      to produce a decisive kill advantage that translates to cap-holding + score.
  #   2. Raise LR from 1e-6 to 2e-6 — twice the step size while keeping entropy 0.02
  #      to prevent collapse. Should still be conservative enough to avoid breaking
  #      the draw basin, but move fast enough to maybe escape it over 300-500 updates.
  #
  # Theory: 30s rounds are too short for 1000 damage combat to produce decisive
  # outcomes. Both teams trade ~4-8 kills per 50 episodes but timeout before anyone
  # scores. 60s gives more time. Combined with 2x LR, PPO can slowly drift toward
  # the winning side of the draw basin.
  #
  # If 60s + 2e-6 still produces only draws at update 500, need to tune damage
  # (slightly lower ~750) or opponent fire rate to create an exploitable asymmetry.
  #
  # Success: any wins or score > 0 within first 500 updates.
  # Stop if still all draws at update 500.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 2.0e-6
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_pretrain_variant: walk_and_shoot
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc_v6
