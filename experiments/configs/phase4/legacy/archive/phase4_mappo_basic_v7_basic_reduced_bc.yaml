phase: 4
env:
  # v7-basic-reduced-bc — adversarial opponent with BC pretrain re-anchor.
  #
  # v7_basic_reduced (warm-start only) failed: basic bot slaughtered agents
  # 50/50 for 200+ updates. Warm-start from v6_5 was unlearned faster than
  # combat could emerge because "cap = instant death" was the only signal.
  #
  # This config adds BC pretrain on top of warm-start. The BC sequence
  # explicitly re-trains cap-walking behavior BEFORE PPO begins, giving a
  # stronger behavioral prior than warm-start weights alone.
  #
  # BC teaches: walk toward cap, do not fire. Then PPO learns combat as
  # survival pressure while defending an existing cap-holding habit.
  # entropy_coef=0.005 preserves BC structure through early PPO updates.
  #
  # Damage: 2500 centi-HP (~4 hits to die). Opponent: basic (contests cap).
  # Success: nonzero score or wins within first 200 updates. If still 0/50
  # losses at update 200, need even lower damage or different approach.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    score_per_second: 0.10
    kill_bonus: 0.25
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    time_penalty_per_second: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 2500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 4
  # Matched to physical CPU cores (4) to reduce contention and context switching.
  rollout_len: 256
  num_epochs: 4
  minibatch_size: 4
  learning_rate: 5.0e-5
  value_normalization: true
  vector_env: async
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.15
  value_clip_ratio: 0.15
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.005
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
run:
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_steps: 500
  bc_batch_size: 1024
  bc_learning_rate: 1.0e-3
  total_updates: 1500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 100
  log_every: 25
  output_dir: runs/phase4_mappo_basic_v7_basic_reduced_bc