phase: 4
metadata:
  phase: phase4
  purpose: architecture_probe
  status: experimental
  expected_runtime: medium
  gate_relevance:
  - phase4_architecture_break_glass
  hypothesis: "Full 3v3 policies fire and strafe but fail to convert aim into hits; an aim-only mini-game with the same Phase 4 actor observation/action/checkpoint interface should quickly learn to map visible enemy_relative_position to aim_delta plus primary_fire, producing >50% greedy hit rate before a full 3v3 warm-start is attempted."
  falsification_criteria: "Falsified if by update 200 greedy eval mean_team_a_kills is below 48 hits per 32-decision episode (50% of 3 agents x 32 target opportunities), or if reward/kill metrics do not trend upward despite direct hit feedback."
  max_updates_if_no_signal: 200
  diagnostic: "2026-05-15 implementation smoke: env.mini_game=aim_only passed focused tests, registry/warm-start compatibility, ruff, git diff --check, and a one-update train_phase4_from_config smoke."
  lineage: "Escape Protocol 5.4 mini-game diagnostic after aux_aim_v1, per_action_entropy_v1, and invalid_fire_mask_v1 were falsified as isolated fixes."
  provenance: "Phase4AimOnlyMappoEnv synthetic aim-and-fire mini-game implementation."

# aim_only_v1 — Escape Protocol 5.4 architecture diagnostic.
#
# This config does not run the full 3v3 objective environment. It routes Phase
# 4 MAPPO through `env.mini_game: aim_only`, preserving actor obs/action shapes
# so the resulting checkpoint can be inspected and, if successful, used as a
# warm-start for a later full 3v3 probe.
#
# Success criteria:
#   - Update 50: eval mean_team_a_kills is clearly above random-init baseline.
#   - Update 200: mean_team_a_kills >= 48 per 32-decision episode, equivalent
#     to at least 50% greedy hit rate over 3 agents.
#
# Failure criteria:
#   - Update 200: mean_team_a_kills < 48, or metrics plateau despite direct
#     per-agent hit reward.

env:
  seed_base: 3519994490
  opponent_bot: noop
  learner_team: A
  mini_game: aim_only
  mini_game_config:
    episode_decisions: 32
    target_distance: 0.45
    target_angle_limit: 0.75
    hit_tolerance: 0.12
    hit_reward: 1.0
    miss_penalty: 0.25
    no_fire_penalty: 0.05
    aim_error_coef: 0.1
    resample_target_each_step: true
  reward: {}
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 64
  num_epochs: 2
  learning_rate: 3.0e-4
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.2
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.95
  gae_lambda: 0.90
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0

run:
  total_updates: 200
  eval_every: 20
  eval_episodes: 50
  checkpoint_every: 20
  log_every: 5
  output_dir: runs/phase4_mappo_aim_only_v1
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
