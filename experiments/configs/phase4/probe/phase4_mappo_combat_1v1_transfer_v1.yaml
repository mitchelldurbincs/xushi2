phase: 4
metadata:
  phase: phase4
  purpose: combat_transfer
  status: experimental
  expected_runtime: short
  gate_relevance:
  - phase4_combat_curriculum
  hypothesis: "A checkpoint that clears the simplified combat_1v1 gate may transfer some aim/fire skill into full 3v3 weak_basic_v2 if we avoid the BC pass that previously erased synthetic aim skills."
  falsification_criteria: "Falsified if update-50 full 3v3 eval still has no Team A score/wins and no combat improvement over weak_basic_v2."
  max_updates_if_no_signal: 50
  lineage: "Scale-back-up probe after combat_1v1_v2 cleared the 12-kill simplified combat gate."
  provenance: "Autonomous continuation after t_19e3b9be5a6 on 2026-05-18."

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 50
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_combat_1v1_transfer_v1
  init_from_checkpoint: runs/phase4_mappo_combat_1v1_v2/mappo/ckpt_final.pt
