phase: 4
metadata:
  phase: phase4
  purpose: cap_duel_focus_fire_transfer_probe
  status: experimental
  expected_runtime: medium
  gate_relevance:
  - phase4_objective_combat_composition
  hypothesis: "Warm-starting the solved cap-duel policy into full weak_basic_v2 3v3 with team-level focus-fire conditioning preserves kill-then-cap timing while adding concentrated target selection."
  success_threshold_update_50: "Success if update-50 eval has >0 Team A score, >0 wins, or Team A kills > Team B kills with recent training on-point contact > 0.25."
  falsification_criteria: "Falsified if update-50 eval has 0 Team A score, 0 wins, recent training on-point contact < 0.25, and Team A hit/fire < 0.02."
  max_updates_if_ambiguous: 100
  lineage: "Combines solved phase4_mappo_cap_duel_v1 checkpoint with phase4_mappo_focus_fire_v1 target-conditioning infrastructure."
  eval_metrics:
  - team_a_same_target_fraction
  - team_a_target_selection_entropy
  - target_selection_fallback_rate

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 4
  target_conditioned_combat: true
  target_selection_label: team_focus_low_hp
  target_selection_aux_coef: 0.5
  target_selection_aux_mode: team_focus_low_hp
  target_selection_objective_proximity_coef: 0.1

run:
  total_updates: 100
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_cap_duel_focus_fire_v1
  init_from_checkpoint: runs/phase4_mappo_cap_duel_v1/mappo/ckpt_0075.pt
