phase: 4
metadata:
  phase: phase4
  purpose: full_env_rehearsal_v1
  status: experimental
  expected_runtime: medium
  gate_relevance:
    - phase4_objective_combat_composition
    - phase4_full_env_teacher_rehearsal
  hypothesis: >
    A scripted full-env rehearsal stage using only actor-visible observations can
    bind objective movement, visible-enemy aim/fire, and existing focus-fire
    target labels before PPO starts. If the pre-PPO gate fails, PPO should not
    launch.
  falsification_criteria: >
    Falsified before PPO if full-env rehearsal cannot produce Team A hit/fire
    above 0.04, objective on-point/contact above 0.25, and fewer than 50 losses
    in the rehearsal gate.
  lineage: >
    Follow-up to cap_duel v2 composition rehearsal, PPO-time cap_duel
    distillation, and cap_duel v2 focus-fire, all of which failed to bind
    combat into full weak_basic_v2 3v3.

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_full_env_rehearsal

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  self_play:
    enabled: false
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 4
  target_conditioned_combat: true
  target_selection_aux_coef: 0.5
  target_selection_aux_mode: team_focus_low_hp
  target_selection_objective_proximity_coef: 0.1

run:
  total_updates: 100
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_full_env_rehearsal_v1
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  full_env_rehearsal:
    enabled: true
    steps: 2000
    batch_size: 256
    learning_rate: 1.0e-4
    teacher: scripted_objective_focus_fire
    target_conditioned_combat: true
    movement_coef: 1.0
    aim_coef: 1.0
    fire_coef: 1.0
    target_selection_coef: 0.5
    gate:
      episodes: 50
      min_team_a_hit_fire: 0.04
      min_objective_on_point: 0.25
      max_losses: 49
      output: full_env_rehearsal_gate.json
  matrix_eval:
    episodes: 50
    anchor_bots:
      - noop
      - weak_basic_v2
      - basic
    output: matrix_eval.json

phase_gate:
  phase: phase4_full_env_rehearsal_v1
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: weak_basic_v2_score
      metric: eval/mean_score_a
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: weak_basic_v2_wins
      metric: eval/wins
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: anchor_vs_basic_score
      metric: matrix/anchor/basic/mean_score_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 1.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: anchor_vs_noop_no_loss
      metric: matrix/anchor/noop/loss_rate
      source: local
      aggregation: { type: max, window: all }
      comparator: "<="
      threshold: 0.5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_full_env_rehearsal_3v3
        prompt: >
          In a greedy 3v3 replay vs weak_basic_v2 after full-env rehearsal,
          does Team A approach/hold the point, aim and fire at visible enemies,
          create a combat advantage, and convert score without obvious reward
          hacking?
