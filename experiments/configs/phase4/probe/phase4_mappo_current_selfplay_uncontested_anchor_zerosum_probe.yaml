phase: 4
metadata:
  phase: phase4
  purpose: current_selfplay_uncontested_anchor_zerosum_probe
  status: experimental
  expected_runtime: medium
  gate_relevance:
    - phase4_current_selfplay_learning_signal
    - phase4_anchor_transfer
    - phase4_objective_conversion
  hypothesis: "Zero-sum uncontested-point shaping should penalize the current Team-A policy when weak_basic_v2 owns uncontested point, turning yesterday's diagnostic-only Team-B uncontested signal into a real denial/capture gradient."
  falsification_criteria: "Falsified if canonical eval by update 150 still has zero Team A score, near-zero Team A uncontested seconds, and weak_basic_v2 continues converting double-digit score."
  lineage: "Follow-up to phase4_mappo_current_selfplay_uncontested_anchor_long partial run p2yu88f3, which reached update 225 with Team A score 0.00 and Team B uncontested dominance under non-mirrored shaping."

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_current_selfplay

env:
  seed_base: 3519994490
  self_play:
    enabled: true
  self_play_schedule:
    weights:
      current: 0.15
      snapshot: 0.0
      anchor: 0.85
    anchor_bot: weak_basic_v2
  objective_timing_curriculum:
    enabled: true
    initial_unlock_seconds: 10.0
    initial_capture_seconds: 5.0
    final_unlock_seconds: 15.0
    final_capture_seconds: 8.0
    anneal_updates: 150
    eval_canonical_every: 25
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.0
    majority_on_point_coef: 0.0
    majority_on_point_anneal_updates: 0
    majority_on_point_distribute: on_point
    uncontested_on_point_coef: 0.20
    uncontested_on_point_anneal_updates: 150
    uncontested_on_point_distribute: on_point
  sim:
    round_length_seconds: 60
    objective_unlock_seconds: 10.0
    objective_capture_seconds: 5.0
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 32
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 2.0e-6
  value_normalization: true
  value_per_agent: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5

run:
  total_updates: 150
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_current_selfplay_uncontested_anchor_zerosum_probe
  init_from_checkpoint: runs/phase4_mappo_current_selfplay_anchor_mix_long/mappo/ckpt_0300.pt
