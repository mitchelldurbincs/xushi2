phase: 4
metadata:
  phase: phase4
  purpose: architecture_probe
  status: experimental
  expected_runtime: short
  gate_relevance:
  - phase4_architecture_break_glass
  hypothesis: "A target-conditioned combat head can reduce Phase-4 weak_basic combat diffusion by selecting one of three enemy slots, conditioning aim/fire on that selected target, and supervising the target head toward the nearest visible enemy without changing game rules, rewards, opponent, damage, round length, action space, or observation space."
  falsification_criteria: "Falsified if BC eval has Team A hit/fire <=0.025 or nearest-visible aim error >=1.3 rad; if the BC gate fails, PPO must not start. If the gate passes, stop PPO at update 50 unless combat metrics or score improve over aim_target_bc_v1."
  max_updates_if_no_signal: 50
  diagnostic: "Instrumentation-gated structural probe recommended after 18+ Phase-4 variants showed draw-basin behavior, low Team A hit/fire, high aim error, and diffuse target attribution."
  lineage: "Follow-up to phase4_mappo_aim_target_bc_v1 and docs/reports/phase4_next_experiment_recommendation.md."
  provenance: "Autonomous kanban task t_19e2ceffb7d on 2026-05-15."

# target_cond_v1 keeps the successful aim-only checkpoint target replacement
# from aim_target_bc_v1, then adds only actor-side target selection,
# target-conditioned aim/fire heads, and per-checkpoint combat metrics.

env:
  seed_base: 3519994490
  opponent_bot: weak_basic
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 3
  target_conditioned_combat: true
  target_selection_aux_coef: 0.25
  target_selection_aux_mode: nearest_visible

run:
  total_updates: 50
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_target_cond_v1
  init_from_checkpoint: runs/phase4_mappo_aim_only_v1/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
  bc_batch_size: 256
  bc_aim_target_checkpoint: runs/phase4_mappo_aim_only_v1/mappo/ckpt_final.pt
  bc_aim_rehearsal_batch_size: 256
  bc_combat_gate:
    min_team_a_hit_fire: 0.025
    max_team_a_aim_error_rad: 1.3
