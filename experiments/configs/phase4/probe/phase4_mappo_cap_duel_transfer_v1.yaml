phase: 4
metadata:
  phase: phase4
  purpose: cap_duel_transfer
  status: experimental
  expected_runtime: short
  gate_relevance:
  - phase4_objective_combat_composition
  hypothesis: "A checkpoint that solves the cap-duel mini-game may transfer objective-coupled combat timing into full 3v3 weak_basic_v2."
  falsification_criteria: "Falsified if update-50 eval has 0 Team A score, 0 wins, and on-point contact below 0.25."
  max_updates_if_no_signal: 50
  lineage: "Scale-up probe after phase4_mappo_cap_duel_v1 solved cap_duel at update 50 and update 75."
  provenance: "Strategy 2 from docs/reports/2026-05-18-phase4-strategic-proposal.md."

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 50
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_cap_duel_transfer_v1
  init_from_checkpoint: runs/phase4_mappo_cap_duel_v1/mappo/ckpt_0075.pt
