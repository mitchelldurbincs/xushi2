phase: 4
metadata:
  phase: phase4
  purpose: combat_curriculum
  status: experimental
  expected_runtime: medium
  gate_relevance:
  - phase4_combat_curriculum
  hypothesis: "A much weaker objective-contesting opponent can manufacture enough positive combat/score signal for MAPPO to amplify: weak_basic_v2 keeps weak_basic objective movement but uses deterministic ±1.5 rad aim noise and a 60-tick fire cadence."
  falsification_criteria: "Falsified if by update 500 eval still has no Team A wins, no Team A score, and no combat improvement over weak_basic_v1/target_cond_v1 baselines."
  max_updates_if_no_signal: 500
  lineage: "Priority 3 after target-conditioned combat head failed the BC gate and hold_and_shoot v2/v3 were already falsified."
  provenance: "Autonomous kanban task after t_19e3b695b96 on 2026-05-18."

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_weak_basic_v2
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
