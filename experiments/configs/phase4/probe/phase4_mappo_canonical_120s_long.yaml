phase: 4
metadata:
  phase: phase4
  purpose: canonical_120s_round_long
  status: experimental
  expected_runtime: long
  gate_relevance:
    - phase4_objective_conversion
    - phase4_episode_length
  hypothesis: "If the real issue is that 60s Phase 4 episodes end before the policy can turn kill/majority windows into ownership and score, then canonical 15s/8s objective timing with a 120s round should show nonzero Team A score, cap progress, or wins during a longer W&B run."
  falsification_criteria: "Falsified if update 250 still has zero Team A score/wins, no sustained uncontested-on-point seconds, and no cap-progress gain despite the longer round."
  lineage: "Contrasts timing-curriculum probes with the real objective timing while only extending the episode horizon."

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_objective_timing

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.0
    majority_on_point_coef: 0.15
    majority_on_point_anneal_updates: 250
    majority_on_point_distribute: on_point
  sim:
    round_length_seconds: 120
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 250
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_canonical_120s_long
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
  bc_batch_size: 384
  bc_learning_rate: 0.001
