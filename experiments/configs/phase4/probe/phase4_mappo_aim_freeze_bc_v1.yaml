phase: 4
metadata:
  phase: phase4
  purpose: architecture_probe
  status: experimental
  expected_runtime: short
  gate_relevance:
  - phase4_architecture_break_glass
  hypothesis: "Standard walk-and-shoot BC erases the aim-only checkpoint; freezing the shared actor trunk and continuous aim row during post-load BC should preserve the synthetic aim mapping while adapting movement/fire heads enough for the first weak_basic 3v3 PPO eval to improve over the standard-BC baseline."
  falsification_criteria: "Falsified if the frozen-BC diagnostic preserves aim-only hits but the first weak_basic PPO eval still has 0 wins, score 0 for Team A, and kills no better than the standard-BC retention baseline of 6.0/5.0, or if aim-only hits fall below 80/96 after BC."
  max_updates_if_no_signal: 50
  diagnostic: "2026-05-15 frozen-BC retention diagnostic preserved aim-only skill at 94.58/96 hits after 500 BC steps, with zero drift in the protected actor trunk and aim row, but immediate weak_basic 3v3 eval regressed to 0W/50L/0D, score 0/7, kills 0/3."
  lineage: "Escalation Option 1 after phase4_mappo_aim_transfer_v1 and the standard-BC retention diagnostic showed 500-step walk-and-shoot BC erased the aim-only mapping."
  provenance: "Human selected Option 1 from docs/reports/phase4_stalemate_escalation.md."

# aim_freeze_bc_v1 — Escalation Option 1 first-eval probe.
#
# This is intentionally capped at the first PPO eval. The only intended lever
# versus aim_transfer_v1 is `run.bc_freeze_actor_aim: true`, which freezes the
# shared actor trunk and masks the continuous aim action row during BC.

env:
  seed_base: 3519994490
  opponent_bot: weak_basic
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 50
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_aim_freeze_bc_v1
  init_from_checkpoint: runs/phase4_mappo_aim_only_v1/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
  bc_freeze_actor_aim: true
