phase: 4
metadata:
  phase: phase4
  purpose: objective_timing_fixed_easy_long
  status: experimental
  expected_runtime: long
  gate_relevance:
    - phase4_objective_conversion
    - phase4_capture_latency
  hypothesis: "If the current Phase 4 policy has enough combat and majority-on-point skill but the 15s unlock + 8s capture latency is too sparse, then a fixed 5s unlock + 2s capture probe should convert the existing kill edge into nonzero Team A score and wins during a longer W&B run."
  falsification_criteria: "Falsified if by update 250 Team A still has zero score, zero wins, weak or declining cap-progress gain, and no increase in uncontested-on-point seconds against weak_basic_v2."
  lineage: "Follows the majority-advantage smoke result: Team A created kill and majority-on-point edges but did not convert those windows into canonical score."

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_objective_timing

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.0
    majority_on_point_coef: 0.15
    majority_on_point_anneal_updates: 250
    majority_on_point_distribute: on_point
  sim:
    round_length_seconds: 60
    objective_unlock_seconds: 5.0
    objective_capture_seconds: 2.0
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 250
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_objective_timing_easy_long
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500
  bc_batch_size: 384
  bc_learning_rate: 0.001
