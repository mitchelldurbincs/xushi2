phase: 4
metadata:
  phase: phase4
  purpose: current_selfplay_bc_probe
  status: experimental
  expected_runtime: medium
  gate_relevance:
    - phase4_current_selfplay_learning_signal
  hypothesis: "Current-vs-current six-agent self-play needs a simple walk-and-shoot BC warm start before PPO can produce meaningful objective approach or combat diagnostics."
  falsification_criteria: "Falsified if by update 50 rollout on-point fraction stays below 0.25, eval majority/uncontested seconds remain near zero, and hit/fire remains collapsed for both teams."
  max_updates_if_no_signal: 50
  lineage: "Minimal Phase 4 current self-play probe with BC bootstrap; self-play win rate is not a gate metric."
  stop_criteria:
    - "Use rollout self_on_point_fraction, eval majority/uncontested seconds, cap-progress, hit/fire, and aim error as the primary evidence."
    - "Do not treat current-vs-current win rate as progress."

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_current_selfplay

env:
  seed_base: 3519994490
  self_play:
    enabled: true
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.0
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 16
  rollout_len: 64
  num_epochs: 2
  minibatch_size: 128
  learning_rate: 3.0e-6
  value_normalization: true
  value_per_agent: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5

run:
  total_updates: 50
  eval_every: 10
  eval_episodes: 20
  checkpoint_every: 10
  log_every: 5
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 300
  bc_batch_size: 384
  bc_learning_rate: 0.001
  output_dir: runs/phase4_mappo_current_selfplay_bc_probe
