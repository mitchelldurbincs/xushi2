phase: 4
metadata:
  phase: phase4
  purpose: conversion_v4_entropy
  status: experimental
  expected_runtime: long
  gate_relevance:
    - phase4_objective_conversion
  hypothesis: >
    v3's post-mortem (journal 2026-07-29) established three facts: (1)
    canonical greedy conversion peaks when training respawn is ~600t (record
    2.87/50-0 at v3 update 225) and is destroyed whenever training respawn
    drops below ~550t, independent of anneal speed; (2) 600t training
    transfers to 240t greedy eval, so descending to 240t is unnecessary and
    harmful; (3) the greedy/stochastic gap is sampling noise — scaling
    ckpt_0225's eval std from 1.0x to 0.1x monotonically restores sampled
    wins (0 -> 5/24, bot shut out). This run therefore trains AT 600t with no
    respawn descent and anneals the entropy bonus (1.0 -> 0.1 scale over 300
    updates) so the sampled policy sharpens toward its already-converting
    mean. Success bar: the post-training STOCHASTIC canonical matrix scores
    > 0 vs weak_basic_v2 — the bar every previous run failed.
  falsification_criteria: >
    Falsified if rollout entropy has not declined below ~2.5 by update 300
    (the scale anneal failed to actually sharpen the policy); or if
    canonical_eval/mean_score_a (greedy, true 240t/15s/8s) is 0 for three
    consecutive evals after update 100 (sharpening destroyed the converting
    mean — warm start at 600t should score from early on); or if hit/fire
    < 0.015 for two consecutive evals; or on optimizer instability (grad-norm
    spikes / NaN losses) as the bonus decays — final_scale is 0.1 rather
    than 0 precisely to keep a floor under log_std in an unattended run.
  leading_indicators: >
    Rollout entropy declining from 3.10 while eval scores hold; rollout
    maj_sec rising under sampling (the direct stochastic-hold precursor);
    canonical_eval/mean_score_a >= 1 sustained (v3 managed 2.87 only
    transiently); the run gate is the stochastic matrix at the end.
  lineage: >
    Warm-starts data/checkpoints/phase4_conversion_v3_upd225_canonical_peak.pt
    (= conversion_v3_slowanneal ckpt_0225, canonical greedy record 2.87).
    Direct successor to conversion_v3_slowanneal (2026-07-29). Anchor KL
    references the same warm start, annealed fast (150) so it does not fight
    the entropy sharpening. Opponent mix dropped: v3 showed 10% noop episodes
    under an anchor change nothing measurable.

wandb:
  enabled: true
  required: false
  init_timeout_seconds: 30
  group: phase4_conversion

env:
  actor_obs: multi_enemy_entity_grid
  seed_base: 3519994493
  opponent_bot: weak_basic_v2
  learner_team: A
  self_play:
    enabled: false
  # Degenerate (constant) timing curriculum: 15s/8s throughout. The block
  # exists because eval_canonical_every is parsed from it; the canonical
  # eval itself now always runs at the canonical constants (240t/15s/8s).
  objective_timing_curriculum:
    enabled: true
    initial_unlock_seconds: 15.0
    initial_capture_seconds: 8.0
    final_unlock_seconds: 15.0
    final_capture_seconds: 8.0
    anneal_updates: 1
    eval_canonical_every: 25
  # No respawn curriculum: training respawn is FIXED at 600t, the proven
  # conversion zone. The canonical eval measures 240t transfer every 25
  # updates; descending training itself to 240t is what killed v2 and v3.
  reward:
    shaping_clip: 30.0
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 0.5
    kill_bonus: 0.1
    damage_dealt_coef: 0.005
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.02
    majority_on_point_coef: 0.0
    uncontested_on_point_coef: 0.15
    uncontested_on_point_anneal_updates: 0
    uncontested_on_point_distribute: on_point
    cap_progress_potential_coef: 1.0
    capture_completed_bonus: 2.0
  sim:
    round_length_seconds: 60
    objective_unlock_seconds: 15.0
    objective_capture_seconds: 8.0
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994493
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 600

model:
  use_recurrence: true
  obs_encoder: entity_attention_grid
  entity_token_count: 5
  entity_token_dim: 18
  entity_num_heads: 2
  grid_channels: 3
  grid_size: 32
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-5
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  entropy_coef_move: 0.01
  entropy_coef_aim: 0.03
  entropy_coef_binary: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0
  target_selection_dim: 0
  target_conditioned_combat: false
  target_selection_aux_coef: 0.0
  critic_warmup_updates: 10
  # Anchor anneals fast (150) so it does not hold entropy up against the
  # sharpening — its job here is only to protect combat through warmup.
  anchor_kl_coef: 1.0
  anchor_kl_anneal_updates: 150
  # The one new knob (2026-07-29): entropy bonus 1.0x -> 0.1x over 300
  # updates, then held. 0.1 floor rather than 0.0 for unattended stability.
  entropy_anneal_updates: 300
  entropy_final_scale: 0.1

run:
  total_updates: 400
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_conversion_v4_entropy
  init_from_checkpoint: data/checkpoints/phase4_conversion_v3_upd225_canonical_peak.pt
  matrix_eval:
    episodes: 50
    stochastic: true
    anchor_bots:
      - noop
      - weak_basic_v2
      - basic
    output: matrix_eval.json

phase_gate:
  phase: phase4_conversion_v4_entropy
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: canonical_score
      metric: canonical_eval/mean_score_a
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 1.0
      min_samples: 3
      on_missing: EVIDENCE_INSUFFICIENT
    - id: canonical_wins
      metric: canonical_eval/wins
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 25
      min_samples: 3
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
