phase: 4
metadata:
  phase: phase4
  purpose: objective_conversion_bridge_v1
  status: experimental_preflight
  expected_runtime: medium
  gate_relevance:
    - phase4_objective_conversion_bridge
    - phase4_anchor_transfer
  hypothesis: >
    The closed-loop bridge checkpoint already wins combat but loses the
    hold-and-convert phase. A bounded opt-in closed-loop conversion bridge can
    train movement/aim/fire labels on policy-induced states while emphasizing
    states near the objective, on the point, or with capture progress, producing
    nonzero pre-PPO score before any PPO updates.
  falsification_criteria: >
    Falsified before PPO if the pre-PPO neural-policy gate after the bridge does
    not produce nonzero Team A score/capture conversion, useful hit/fire,
    objective pressure, and not 50/50 losses against weak_basic_v2.
  lineage: >
    Warm-starts data/checkpoints/phase4_multi_enemy_closed_loop_bridge_v1.pt,
    the tracked copy of the 2026-05-22 closed-loop supervised bridge checkpoint.

wandb:
  enabled: false
  required: false
  init_timeout_seconds: 30
  group: phase4_objective_conversion_bridge_v1

env:
  actor_obs: multi_enemy_entity_grid
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  self_play:
    enabled: false
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 0.5
    kill_bonus: 0.5
    damage_dealt_coef: 0.005
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.02
    majority_on_point_coef: 0.0
    uncontested_on_point_coef: 0.15
    uncontested_on_point_anneal_updates: 0
    uncontested_on_point_distribute: on_point
    cap_progress_potential_coef: 1.0
    capture_completed_bonus: 2.0
  sim:
    round_length_seconds: 60
    objective_unlock_seconds: 15.0
    objective_capture_seconds: 8.0
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  obs_encoder: entity_attention_grid
  entity_token_count: 5
  entity_token_dim: 18
  entity_num_heads: 2
  grid_channels: 3
  grid_size: 32
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  learning_rate: 3.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  entropy_coef_move: 0.01
  entropy_coef_aim: 0.03
  entropy_coef_binary: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 0
  target_conditioned_combat: false
  target_selection_aux_coef: 0.0

run:
  total_updates: 100
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_objective_conversion_bridge_v1
  init_from_checkpoint: data/checkpoints/phase4_multi_enemy_closed_loop_bridge_v1.pt
  multi_enemy_supervised_bridge:
    enabled: true
    teacher: multi_enemy_conversion_hold
    movement_coef: 2.0
    aim_coef: 1.0
    fire_coef: 1.0
    target_selection_coef: 0.0
    closed_loop:
      enabled: true
      rounds: 20
      updates_per_round: 50
      batch_size: 384
      learning_rate: 1.0e-4
      conversion_sample_weight: 6.0
      conversion_cap_progress_floor: 0.01
      conversion_objective_radius: 0.16
    gate:
      episodes: 50
      min_team_a_visible_fire_rate: 0.01
      min_team_a_hit_fire: 0.04
      min_objective_on_point: 0.25
      min_mean_score_a: 1.0
      min_uncontested_on_point_seconds_a: 8.0
      min_cap_progress_gain_ticks: 240.0
      max_losses: 49
      output: objective_conversion_bridge_gate.json
  matrix_eval:
    episodes: 50
    anchor_bots:
      - noop
      - weak_basic_v2
      - basic
    output: matrix_eval.json

phase_gate:
  phase: phase4_objective_conversion_bridge_v1
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: weak_basic_v2_score
      metric: eval/mean_score_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: weak_basic_v2_wins
      metric: eval/wins
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: conversion_uncontested_floor
      metric: eval/mean_uncontested_on_point_seconds_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 8.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_objective_conversion_bridge_3v3
        prompt: >
          In a greedy 3v3 replay vs weak_basic_v2 after the conversion bridge,
          does Team A fight near the point, stay on the point after clearing
          it, complete captures, and score without obvious shaping exploitation?
