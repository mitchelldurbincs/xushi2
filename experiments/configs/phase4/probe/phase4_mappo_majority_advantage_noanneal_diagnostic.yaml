phase: 4
metadata:
  phase: phase4
  purpose: majority_advantage_noanneal_diagnostic
  status: experimental
  expected_runtime: short
  gate_relevance:
    - phase4_objective_conversion
  hypothesis: "Holding majority-on-point alpha constant for a short diagnostic should reveal whether the new signal is behaviorally strong enough before testing anneal."
  falsification_criteria: "Falsified if by update 25 rollout/eval majority-on-point seconds stay flat, cap-progress gain remains zero, and self_on_point_fraction falls below 0.25."
  max_updates_if_no_signal: 25
  lineage: "Diagnostic sibling of phase4_mappo_majority_advantage_smoke; not gate evidence because alpha does not anneal to zero."
  stop_criteria:
    - "Stop if rollout self_on_point_fraction < 0.25."
    - "Stop if Team A hit/fire collapses relative to weak_basic_v2."
    - "Use only to check signal strength, not as Phase 4 gate evidence."

env:
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.0
    majority_on_point_coef: 0.2
    majority_on_point_anneal_updates: 0
    majority_on_point_distribute: on_point
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 16
  rollout_len: 64
  num_epochs: 2
  minibatch_size: 128
  learning_rate: 3.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 25
  eval_every: 5
  eval_episodes: 20
  checkpoint_every: 5
  log_every: 5
  output_dir: runs/phase4_mappo_majority_advantage_noanneal_diagnostic
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 300
  bc_batch_size: 384
  bc_learning_rate: 0.001
