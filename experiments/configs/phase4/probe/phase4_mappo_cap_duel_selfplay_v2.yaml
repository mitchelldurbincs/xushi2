phase: 4
metadata:
  phase: phase4
  purpose: cap_duel_selfplay_v2
  status: experimental
  expected_runtime: medium
  gate_relevance:
    - phase4_objective_combat_composition
    - phase4_cap_duel_selfplay_gate
  hypothesis: >
    Cap_duel v2 removes three engineered quirks from v1 that the v1 policy
    learned to exploit (spawn-on-point, shot knockback, respawn-on-point),
    making the env physically closer to the canonical 3v3 sim. A policy
    that wins this env must approach the point, engage and kill the enemy,
    then physically hold the point — none of which can be replaced by the
    deleted v1 helpers. If the v1 verdict was honest, training under these
    stricter rules from the same v6.5 warm-start should still clear the
    duel gate within the same compute budget; if not, the v1 "kill_then_hold"
    behavior was a quirk-exploit and the cap_duel teacher path is unsound.
  falsification_criteria: >
    Falsified if v2 self-play fails the duel gate after 250 updates, OR if
    the trained policy's score-event distribution is no longer 100%
    kill_then_hold under inspection (e.g. displaces by accident, refuses to
    approach the point because v6.5 navigation was unlearned, or scores
    while enemy is alive somewhere).
  lineage: >
    Follow-up to the 2026-05-21 cap_duel v1 rollout inspection that found
    v1 wins were partly engineered by env quirks not present in the
    canonical Phase 4 sim.

wandb:
  enabled: true
  required: true
  init_timeout_seconds: 30
  group: phase4_cap_duel

env:
  seed_base: 3519994490
  opponent_bot: noop
  learner_team: A
  mini_game: cap_duel
  mini_game_config:
    episode_decisions: 96
    enemy_hp: 3
    point_radius: 0.18
    score_ticks_to_clear: 12
    enemy_recontest_delay: 12
    hit_tolerance: 0.12
    hit_reward: 1.0
    kill_bonus: 4.0
    score_per_tick: 0.1
    off_point_penalty: 0.0
    time_penalty_per_decision: 0.0
    # v2 realism knobs — match the canonical 3v3 sim closer.
    knockback_magnitude: 0.0
    spawn_distance: 0.4
    respawn_at_spawn_position: true
  self_play:
    enabled: true
  self_play_schedule:
    weights:
      current: 0.7
      anchor: 0.3
      snapshot: 0.0
    anchor_bot: noop
  reward: {}
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 1.0e-6
  value_normalization: true
  value_per_agent: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5

run:
  total_updates: 250
  eval_every: 25
  eval_episodes: 50
  checkpoint_every: 25
  log_every: 5
  output_dir: runs/phase4_mappo_cap_duel_selfplay_v2
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 500

phase_gate:
  phase: phase4_cap_duel_selfplay_v2
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: cap_duel_score
      metric: eval/mean_score_a
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 6.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: cap_duel_kills
      metric: eval/team_a_kills
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: cap_duel_wins
      metric: eval/wins
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 25
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_kill_then_hold_v2
        prompt: >
          In a greedy cap_duel v2 replay (rendered via the HTML cap_duel
          viewer, not the canonical xushi2 viewer), does the learner
          approach the point from its spawn corner, engage the enemy with
          aimed fire, kill the enemy, and physically hold the point during
          the recontest_delay window — rather than relying on any v1 quirk
          (spawn-on-point, knockback displacement, or respawn-on-point) to
          earn score?
