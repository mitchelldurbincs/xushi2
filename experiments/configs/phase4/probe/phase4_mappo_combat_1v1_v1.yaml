phase: 4
metadata:
  phase: phase4
  purpose: combat_simplification
  status: experimental
  expected_runtime: medium
  gate_relevance:
  - phase4_combat_curriculum
  hypothesis: "If 3v3 chaos and objective timing are overwhelming the combat skill, a Phase 4-compatible 1v1 combat mini-game should learn a reliable hit/kill loop quickly while preserving the actor/critic observation and action tensor shapes."
  falsification_criteria: "Falsified if by update 200 greedy eval mean_team_a_kills is below 12 kills per 64-decision episode, or if hit/kill metrics do not trend upward under direct duel reward."
  max_updates_if_no_signal: 200
  lineage: "Priority 4 after target-conditioned combat, hold_and_shoot v2/v3, and weak_basic_v2 failed to produce Phase 4 score or wins."
  provenance: "Phase4Combat1v1MappoEnv mini-game implementation."

env:
  seed_base: 3519994490
  opponent_bot: noop
  learner_team: A
  mini_game: combat_1v1
  mini_game_config:
    episode_decisions: 64
    target_distance: 0.45
    target_angle_limit: 0.8
    target_drift: 0.08
    hit_tolerance: 0.12
    target_hp: 3
    hit_reward: 1.0
    kill_reward: 4.0
    miss_penalty: 0.15
    no_fire_penalty: 0.02
    aim_error_coef: 0.05
  reward: {}
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 64
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 3.0e-4
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.2
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.95
  gae_lambda: 0.90
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 1.0
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.0

run:
  total_updates: 200
  eval_every: 20
  eval_episodes: 50
  checkpoint_every: 20
  log_every: 5
  output_dir: runs/phase4_mappo_combat_1v1_v1
