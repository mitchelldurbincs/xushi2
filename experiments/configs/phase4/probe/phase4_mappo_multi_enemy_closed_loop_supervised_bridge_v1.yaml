phase: 4
metadata:
  phase: phase4
  purpose: multi_enemy_closed_loop_supervised_bridge_v1
  status: experimental_preflight
  expected_runtime: medium
  gate_relevance:
    - phase4_actor_information_ablation
    - phase4_multi_enemy_closed_loop_supervised_bridge
  hypothesis: >
    A bounded opt-in closed-loop supervised bridge can adapt the multi-enemy
    actor topology on policy-induced states using existing multi_enemy_visible
    teacher labels before PPO, without changing rewards, sim rules, action
    semantics, replay format, phase-gate thresholds, or existing W&B metric
    schema.
  falsification_criteria: >
    Falsified before W&B/PPO if the pre-PPO neural-policy gate after the
    closed-loop bridge does not show nonzero Team A visible firing, useful
    hit/fire, objective pressure, nonzero score, and not 50/50 losses against
    weak_basic_v2.

wandb:
  enabled: false
  required: false
  init_timeout_seconds: 30
  group: phase4_multi_enemy_closed_loop_supervised_bridge_v1

env:
  actor_obs: multi_enemy_entity_grid
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  self_play:
    enabled: false
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  obs_encoder: entity_attention_grid
  entity_token_count: 5
  entity_token_dim: 18
  entity_num_heads: 2
  grid_channels: 3
  grid_size: 32
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 0
  target_conditioned_combat: false
  target_selection_aux_coef: 0.0

run:
  total_updates: 100
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_multi_enemy_closed_loop_supervised_bridge_v1
  init_from_checkpoint: runs/phase4_mappo_multi_enemy_supervised_bridge_v1/mappo/ckpt_multi_enemy_supervised_bridge.pt
  multi_enemy_supervised_bridge:
    enabled: true
    teacher: multi_enemy_visible
    movement_coef: 1.0
    aim_coef: 1.0
    fire_coef: 1.0
    target_selection_coef: 0.0
    agreement_output: multi_enemy_closed_loop_supervised_bridge_agreement.json
    closed_loop:
      enabled: true
      rounds: 20
      updates_per_round: 50
      batch_size: 384
      learning_rate: 1.0e-4
    gate:
      episodes: 50
      min_team_a_visible_fire_rate: 0.01
      min_team_a_hit_fire: 0.04
      min_objective_on_point: 0.25
      min_mean_score_a: 1.0
      max_losses: 49
      output: multi_enemy_closed_loop_supervised_bridge_gate.json
  matrix_eval:
    episodes: 50
    anchor_bots:
      - noop
      - weak_basic_v2
      - basic
    output: matrix_eval.json

phase_gate:
  phase: phase4_multi_enemy_closed_loop_supervised_bridge_v1
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: weak_basic_v2_score
      metric: eval/mean_score_a
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: weak_basic_v2_wins
      metric: eval/wins
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: anchor_vs_basic_score
      metric: matrix/anchor/basic/mean_score_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 1.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_multi_enemy_closed_loop_supervised_bridge_3v3
        prompt: >
          In a greedy 3v3 replay vs weak_basic_v2 after the closed-loop
          supervised bridge, does Team A approach/hold the point, aim and fire
          at visible enemies, create a combat advantage, and convert score
          without obvious reward hacking?
