phase: 4
metadata:
  phase: phase4
  purpose: conversion_v1_lr3e6
  status: experimental
  expected_runtime: diagnostic
  gate_relevance:
    - phase4_objective_conversion
    - phase4_anchor_transfer
  hypothesis: >
    Diagnostic rerun of conversion_v1 with a lower PPO learning rate after the
    1e-5 no-W&B run degraded by update 50. This tests whether PPO update size
    erased the closed-loop bridge behavior before the conversion reward could
    stabilize hold-and-capture behavior.
  falsification_criteria: >
    Falsified if by update 50 (eased timing still active) eval shows zero
    captures_a / zero mean_score_a AND uncontested time is not trending up from
    the 4.9s baseline; or if objective contact collapses (recent rollout onpt
    < 0.10) or hit/fire falls below 0.015 for two consecutive evals.
  leading_indicators: >
    Judge early evals on conversion precursors, not score: eval captures,
    uncontested-on-point seconds (baseline 4.9), cap-progress gain vs loss
    (baseline 238/197), reward_metrics/captures_a. Score is ~80 decisions
    downstream and lags these.
  lineage: >
    Derived from phase4_mappo_conversion_v1.yaml. Keeps the same seed,
    warm-start, reward, model, timing curriculum, and opponent; changes only
    W&B logging, learning rate, eval cadence, checkpoint cadence, purpose, and
    output directory.

wandb:
  enabled: false
  required: false
  init_timeout_seconds: 30
  group: phase4_conversion

env:
  actor_obs: multi_enemy_entity_grid
  seed_base: 3519994490
  opponent_bot: weak_basic_v2
  learner_team: A
  self_play:
    enabled: false
  objective_timing_curriculum:
    enabled: true
    initial_unlock_seconds: 5.0
    initial_capture_seconds: 2.0
    final_unlock_seconds: 15.0
    final_capture_seconds: 8.0
    anneal_updates: 150
    eval_canonical_every: 25
  reward:
    shaping_clip: 30.0
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 0.5
    kill_bonus: 0.5
    damage_dealt_coef: 0.005
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.02
    majority_on_point_coef: 0.0
    uncontested_on_point_coef: 0.15
    uncontested_on_point_anneal_updates: 0
    uncontested_on_point_distribute: on_point
    cap_progress_potential_coef: 1.0
    capture_completed_bonus: 2.0
  sim:
    round_length_seconds: 60
    objective_unlock_seconds: 5.0
    objective_capture_seconds: 2.0
    fog_of_war_enabled: false
    randomize_map: false
    seed: 3519994490
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  use_recurrence: true
  obs_encoder: entity_attention_grid
  entity_token_count: 5
  entity_token_dim: 18
  entity_num_heads: 2
  grid_channels: 3
  grid_size: 32
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 256
  learning_rate: 3.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  entropy_coef_move: 0.01
  entropy_coef_aim: 0.03
  entropy_coef_binary: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
  target_selection_dim: 0
  target_conditioned_combat: false
  target_selection_aux_coef: 0.0

run:
  total_updates: 300
  eval_every: 10
  eval_episodes: 50
  checkpoint_every: 10
  log_every: 5
  output_dir: runs/phase4_mappo_conversion_v1_lr3e6
  init_from_checkpoint: data/checkpoints/phase4_multi_enemy_closed_loop_bridge_v1.pt
  matrix_eval:
    episodes: 50
    anchor_bots:
      - noop
      - weak_basic_v2
      - basic
    output: matrix_eval.json

phase_gate:
  phase: phase4_conversion_v1_lr3e6
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: weak_basic_v2_score
      metric: eval/mean_score_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: weak_basic_v2_wins
      metric: eval/wins
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: anchor_vs_weak_basic_v2_score
      metric: matrix/anchor/weak_basic_v2/mean_score_a
      source: local
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_conversion_v1_lr3e6_3v3
        prompt: >
          In a greedy 3v3 replay vs weak_basic_v2, does Team A fight near the
          point, stay on the point after clearing it, complete captures, and
          score -- rather than exploiting the shaping?
