phase: 4
metadata:
  phase: phase4
  purpose: composition_rehearsal
  status: experimental
  expected_runtime: medium
  gate_relevance:
  - phase4_composition_rehearsal
  hypothesis: "Extending composition rehearsal to 2000 steps can clear the original full-3v3 hit/fire retention gate while preserving objective movement and combat_1v1 retention."
  falsification_criteria: "Falsified if composition BC fails objective on-point retention, combat_1v1 kills, the original full weak_basic_v2 hit/fire gate, or aim-error gate, or if PPO degrades behavior without interpretable improvement."
  max_updates_if_no_signal: 50
  lineage: "Strategy 1 from 2026-05-18 Phase 4 strategic proposal."

env:
  seed_base: 1779134702
  opponent_bot: weak_basic_v2
  learner_team: A
  reward:
    score_per_second: 1.0
    time_penalty_per_second: 0.05
    death_penalty: 1.0
    kill_bonus: 1.0
    damage_dealt_coef: 0.01
    distance_shaping_coef: 0.005
    on_point_shaping_coef: 0.05
  sim:
    round_length_seconds: 60
    fog_of_war_enabled: false
    randomize_map: false
    seed: 1779134702
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 1000
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240

model:
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0

ppo:
  num_envs: 64
  rollout_len: 128
  num_epochs: 2
  learning_rate: 1.0e-6
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.02
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3

run:
  total_updates: 500
  eval_every: 50
  eval_episodes: 50
  checkpoint_every: 50
  log_every: 5
  output_dir: runs/phase4_mappo_composition_rehearsal_v2_2000
  init_from_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  composition_pretrain: true
  composition_pretrain_steps: 2000
  composition_gate:
    objective_on_point_gate: 0.25
    objective_losses_gate: 0
    combat_kills_gate: 12.0
    hit_fire_gate: 0.02
    aim_error_gate: 1.55
  composition_objective_teacher_checkpoint: runs/phase4_mappo_basic_v6_5/mappo/ckpt_final.pt
  composition_combat_teacher_checkpoint: runs/phase4_mappo_combat_1v1_v2/mappo/ckpt_final.pt
  composition_objective_batch_size: 256
  composition_combat_batch_size: 256
  composition_eval_episodes: 50
  composition_objective_env:
    opponent_bot: weak_basic_v2
  composition_combat_env:
    mini_game: combat_1v1
    mini_game_config:
      episode_decisions: 64
      target_distance: 0.45
      target_angle_limit: 0.8
      target_drift: 0.08
      hit_tolerance: 0.12
      target_hp: 3
      hit_reward: 1.0
      kill_reward: 4.0
      miss_penalty: 0.15
      no_fire_penalty: 0.02
      aim_error_coef: 0.05
  bc_pretrain_variant: walk_and_shoot
  bc_pretrain_steps: 0

phase_gate:
  phase: phase4_composition_rehearsal_v2_2000
  identity_requirements:
    min_unique_seeds: 1
  objective_checks:
    - id: weak_basic_v2_score
      metric: eval/mean_score_a
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 3.0
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: weak_basic_v2_wins
      metric: eval/wins
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: hit_fire_floor
      metric: eval/team_a_hit_fire
      source: wandb
      aggregation: { type: max, window: all }
      comparator: ">="
      threshold: 0.04
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: aim_error_ceiling
      metric: eval/team_a_aim_error_rad
      source: wandb
      aggregation: { type: min, window: all }
      comparator: "<="
      threshold: 1.5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
    - id: anchor_vs_noop_no_loss
      metric: matrix/anchor/noop/loss_rate
      source: local
      aggregation: { type: max, window: all }
      comparator: "<="
      threshold: 0.5
      min_samples: 1
      on_missing: EVIDENCE_INSUFFICIENT
  subjective_checks:
    required: true
    trigger_if_objective_passed: true
    approval_rule: all_yes
    questions:
      - id: replay_composition_preserved
        prompt: "Does the best-checkpoint replay show BOTH objective movement (reaches/holds cap) AND combat (kills), rather than only one skill surviving?"
      - id: replay_purposeful_targeting
        prompt: "Does target selection look coordinated rather than spray fire, and is point holding consistent enough to convert to score?"

