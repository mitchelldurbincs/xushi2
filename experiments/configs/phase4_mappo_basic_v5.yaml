phase: 4
env:
  # v5: warm-start from v4 (which learned to fire ~28% of the time but
  # didn't aim — agents fired in random directions, never killed). Adds
  # damage_dealt_coef as a per-slot reward for HP actually applied to
  # enemies, giving aim_delta a meaningful gradient. PPO should now be
  # able to learn fire ↔ aim coupling because firing without aim earns
  # nothing while firing at an enemy earns +0.002 per HP × 75 HP per shot
  # = +0.15 per landed shot, plus the existing +0.25 kill_bonus per kill.
  seed_base: 0xD1CEDA7A
  opponent_bot: basic
  learner_team: A
  reward:
    distance_shaping_coef: 0.05
    on_point_shaping_coef: 0.02
    damage_dealt_coef: 0.002
  sim:
    round_length_seconds: 30
    fog_of_war_enabled: false
    randomize_map: false
    seed: 0xD1CEDA7A
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 7500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  embed_dim: 64
  gru_hidden: 64
  head_hidden: 64
  action_log_std_init: -1.0
ppo:
  num_envs: 8
  rollout_len: 128
  num_epochs: 2
  minibatch_size: 4
  learning_rate: 3.0e-4
  value_normalization: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: cosine
  lr_final_ratio: 0.1
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  team_spirit_initial: 0.3
  team_spirit_final: 1.0
  team_spirit_ramp_fraction: 0.3
run:
  total_updates: 250
  eval_every: 25
  eval_episodes: 10
  checkpoint_every: 25
  log_every: 5
  init_from_checkpoint: runs/phase4_mappo_basic_v4/mappo/ckpt_final.pt
  output_dir: runs/phase4_mappo_basic_v5
