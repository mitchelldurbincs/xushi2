phase: 11
env:
  seed_base: 0xC011E611
  fog_mode: team_shared
  visible_radius: 0.65
  self_play_schedule:
    weights:
      current: 0.34
      snapshot: 0.33
      anchor: 0.33
    anchor_bot: noop
  snapshot_league:
    latest:
      - runs/phase8_random_map_probe/mappo/ckpt_final.pt
    historical:
      - runs/phase8_random_map_probe/mappo/ckpt_final.pt
    anchor:
      - runs/phase8_random_map_probe/mappo/ckpt_final.pt
    weights:
      latest: 0.7
      historical: 0.2
      anchor: 0.1
  map_randomization:
    span_jitter: 5.0
    min_span: 45.0
    max_span: 55.0
  reward:
    distance_shaping_coef: 0.02
    on_point_shaping_coef: 0.01
  sim:
    round_length_seconds: 20
    fog_of_war_enabled: false
    randomize_map: true
    seed: 0xC011E611
    action_repeat: 3
    mechanics:
      revolver_damage_centi_hp: 7500
      revolver_fire_cooldown_ticks: 15
      revolver_hitbox_radius: 0.75
      respawn_ticks: 240
model:
  use_recurrence: true
  obs_encoder: entity_attention_grid
  entity_token_count: 5
  entity_token_dim: 18
  entity_num_heads: 2
  grid_channels: 3
  grid_size: 32
  embed_dim: 32
  gru_hidden: 32
  head_hidden: 32
  action_log_std_init: -1.0
ppo:
  num_envs: 1
  rollout_len: 16
  num_epochs: 1
  minibatch_size: 1
  learning_rate: 1.0e-5
  value_normalization: true
  value_per_agent: true
  vector_env: sync
  torch_num_threads: 1
  lr_schedule: constant
  lr_final_ratio: 1.0
  warmup_updates: 0
  clip_ratio: 0.2
  value_clip_ratio: 0.2
  gamma: 0.997
  gae_lambda: 0.95
  entropy_coef: 0.001
  value_coef: 0.5
  max_grad_norm: 0.5
run:
  total_updates: 1
  eval_every: 1
  eval_episodes: 1
  checkpoint_every: 1
  log_every: 1
  matrix_eval:
    episodes: 1
    current_selfplay: true
    anchor_bots:
      - noop
    opponent_checkpoints:
      - runs/phase8_random_map_probe/mappo/ckpt_final.pt
    output: matrix_eval.json
  bc_pretrain_steps: 0
  output_dir: runs/phase11_mixed_league_probe
